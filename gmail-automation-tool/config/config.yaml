email_config:
  gmail_api:
    credentials_file: "config/gmail_credentials.json"
    token_file: "config/token.json"
  
  polling:
    interval_seconds: 5
    timeout_seconds: 60
    max_messages: 10

test_sites:
  hotfrog:
    url: "https://admin.hotfrog.de/"
    email_trigger:
      selector: "[data-testid='send-verification'], button[type='submit']"
    sender_patterns:
      - "noreply@hotfrog.de"
      - "admin@hotfrog.de"
    subject_patterns:
      - "verification"
      - "activate"
    extraction_type: "url"
    
  reddit:
    url: "https://www.reddit.com/"
    email_trigger:
      selector: "[data-testid='send-code']"
    sender_patterns:
      - "noreply@reddit.com"
      - "accounts@reddit.com"
    subject_patterns:
      - "verification code"
      - "confirm"
    extraction_type: "otp"

ai_config:
  openai_api_key: "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"
